<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專案管理看板</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* 這裡保留你原本設計的所有 CSS 樣式 */
    :root { --bg: #0f1117; --bg2: #1a1d27; --bg3: #232635; --border: #2e3248; --text: #e8eaf0; --text2: #9499b0; --text3: #5c6080; --accent: #6c63ff; --accent2: #8b85ff; --green: #2ecc71; --yellow: #f39c12; --red: #e74c3c; --blue: #3498db; --purple: #9b59b6; --radius: 10px; --shadow: 0 2px 12px rgba(0,0,0,0.4); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; }
    /* ... 貼上原本的 Header, Main, Kanban, Modal 等所有樣式 ... */
    /* 為簡化篇幅，請保留你原始提供的所有 <style> 內容 */
    
    /* 確保所有按鈕樣式一致 */
    .header-logo, .header-nav, .nav-btn, .refresh-btn, .gas-url-badge, .main, .page, .summary-grid, .summary-card, .summary-card::before, .summary-num, .summary-label, .board-header, .board-title, .filter-bar, .filter-select, .kanban, .kanban-col, .kanban-col-header, .col-count, .kanban-tasks, .task-card, .task-card:hover, .task-card-title, .task-card-meta, .tag, .task-id, .members-grid, .member-card, .member-avatar, .member-name, .member-role, .member-stats, .stat-item, .stat-num, .stat-label, .member-progress, .member-progress-bar, .projects-list, .project-card, .project-color-dot, .project-info, .project-name, .project-desc, .project-dates, .project-prog-wrap, .project-prog-label, .project-prog-bar-bg, .project-prog-bar, .modal-overlay, .modal-overlay.open, .modal, .modal-title, .modal-field, .modal-field label, .modal-field input, .modal-field select, .modal-field textarea, .modal-actions, .btn-primary, .btn-secondary, .loading-wrap, .spinner, .setup-banner, .setup-banner h2, .setup-banner p, .setup-input-row, .setup-input, .setup-btn { /* 原本樣式 */ }
  </style>
</head>
<body>

<header class="header">
  <div class="header-logo"><span>📋</span> ProjectHub</div>
  <nav class="header-nav">
    <button class="nav-btn active" onclick="showPage('kanban', this)">看板</button>
    <button class="nav-btn" onclick="showPage('members', this)">成員</button>
    <button class="nav-btn" onclick="showPage('projects', this)">專案</button>
  </nav>
  <div class="header-right">
    <span class="gas-url-badge" id="gas-url-display">⚙️ 尚未設定 GAS 網址</span>
    <button class="refresh-btn" onclick="loadData()">🔄 重新整理</button>
  </div>
</header>

<main class="main">
  <div class="setup-banner" id="setup-banner">...</div>

  <div class="page active" id="page-kanban">
    <div class="summary-grid" id="summary-grid">...</div>
    <div class="board-header">
      <div class="board-title">任務看板</div>
      <div class="filter-bar">
        <select class="filter-select" id="filter-assignee" onchange="renderKanban()"><option value="">全部成員</option></select>
        <button class="btn-primary" onclick="openModal('modal-add-task')">+ 新增任務</button>
      </div>
    </div>
    <div class="kanban">...</div>
  </div>

  <div class="page" id="page-members">
    <div class="board-header">
      <div class="board-title">團隊成員</div>
      <button class="btn-primary" onclick="openModal('modal-add-member')">+ 新增成員</button>
    </div>
    <div class="members-grid" id="members-grid"></div>
  </div>

  <div class="page" id="page-projects">
    <div class="board-header">
      <div class="board-title">專案列表</div>
      <button class="btn-primary" onclick="openModal('modal-add-project')">+ 新增專案</button>
    </div>
    <div class="projects-list" id="projects-list"></div>
  </div>
</main>

<div class="modal-overlay" id="modal-add-task">
  <div class="modal">
    <div class="modal-title">➕ 新增任務</div>
    <div class="modal-field"><label>任務標題 *</label><input type="text" id="new-task-title"></div>
    <div class="modal-field"><label>指派成員</label><select id="new-task-assignee"></select></div>
    <div class="modal-field"><label>截止日期</label><input type="date" id="new-task-due"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('modal-add-task')">取消</button>
      <button class="btn-primary" onclick="submitApiData('addTask')">新增</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-add-member">
  <div class="modal">
    <div class="modal-title">👤 新增成員</div>
    <div class="modal-field">
      <label>成員姓名 * (用於 Line 綁定辨識)</label>
      <input type="text" id="new-member-name" placeholder="例：王小明">
    </div>
    <div class="modal-field">
      <label>角色</label>
      <select id="new-member-role">
        <option value="member">一般成員</option>
        <option value="admin">管理員</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('modal-add-member')">取消</button>
      <button class="btn-primary" onclick="submitApiData('addMember')">新增</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-add-project">
  <div class="modal">
    <div class="modal-title">📁 新增專案</div>
    <div class="modal-field"><label>專案名稱 *</label><input type="text" id="new-project-name"></div>
    <div class="modal-field"><label>開始日期</label><input type="date" id="new-project-start"></div>
    <div class="modal-field"><label>結束日期</label><input type="date" id="new-project-end"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('modal-add-project')">取消</button>
      <button class="btn-primary" onclick="submitApiData('addProject')">新增</button>
    </div>
  </div>
</div>

<script>
// 保留你原本定義的變數與初始化邏局 (GAS_URL, loadData, renderKanban, renderMembers, renderProjects...)
// 這裡補充核心的 API 呼叫邏輯：

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// 統一的 API 送出處理
async function submitApiData(actionType) {
  let dataPayload = {};
  
  if (actionType === 'addTask') {
    const title = document.getElementById('new-task-title').value.trim();
    if (!title) return alert('請輸入任務標題');
    dataPayload = {
      id: Date.now().toString(36),
      title: title,
      assignee: document.getElementById('new-task-assignee').value,
      status: 'todo',
      dueDate: document.getElementById('new-task-due').value,
      createdAt: new Date().toISOString()
    };
  } else if (actionType === 'addMember') {
    const name = document.getElementById('new-member-name').value.trim();
    if (!name) return alert('請輸入成員姓名');
    dataPayload = {
      id: Date.now().toString(36),
      name: name,
      role: document.getElementById('new-member-role').value,
      lineUserId: '', // 預設空白，由成員自己用 Line 輸入 /bind 綁定
      email: ''
    };
  } else if (actionType === 'addProject') {
    const name = document.getElementById('new-project-name').value.trim();
    if (!name) return alert('請輸入專案名稱');
    dataPayload = {
      id: Date.now().toString(36),
      name: name,
      startDate: document.getElementById('new-project-start').value,
      endDate: document.getElementById('new-project-end').value,
      status: 'active',
      color: '#3498db'
    };
  }

  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: actionType, data: dataPayload })
    });
    
    const result = await res.json();
    if (result.status === 'success') {
      alert('新增成功！');
      await loadData(); // 重新載入畫面資料
      
      // 關閉並清空對應的 Modal
      if (actionType === 'addTask') { closeModal('modal-add-task'); document.getElementById('new-task-title').value=''; }
      if (actionType === 'addMember') { closeModal('modal-add-member'); document.getElementById('new-member-name').value=''; }
      if (actionType === 'addProject') { closeModal('modal-add-project'); document.getElementById('new-project-name').value=''; }
    } else {
      alert('處理失敗: ' + result.message);
    }
  } catch (err) {
    console.error(err);
    alert('發生錯誤，請檢查網路連線。');
  }
}
</script>
</body>
</html>
